[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-snowflake-agent-context"
version = "0.1.0"
description = "Extension helpers for using Snowflake metadata with OpenAI Python SDK coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rich Archer" }
]
dependencies = [
  "openai>=1.0.0",
  "snowflake-connector-python>=3.0.0",
  "pydantic>=2.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
snowflake-agent-harness-start = "openai_snowflake_agent_context.agent_harness_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]
semantic = [
  "numpy>=1.26.0",
]
cloud = [
  "boto3>=1.34.0",
  "google-cloud-storage>=2.16.0",
  "google-api-python-client>=2.130.0",
]
chatgpt-plugin = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
aws = [
  "mangum>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_snowflake_agent_context"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
addopts = ["--capture=sys"]
pythonpath = ["src"]
testpaths = ["tests"]
